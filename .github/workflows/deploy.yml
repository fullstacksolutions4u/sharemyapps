name: Deploy to GCP

on:
  push:
    branches: [main]

jobs:
  deploy-server:
    name: Build & Deploy Server to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push server image
        run: |
          gcloud builds submit ./server \
            --tag us-central1-docker.pkg.dev/sharemyapps-498401/sharemyapps/server:latest \
            --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sharemyapps-server \
            --image us-central1-docker.pkg.dev/sharemyapps-498401/sharemyapps/server:latest \
            --region us-central1 \
            --platform managed \
            --quiet

  deploy-client:
    name: Build & Deploy Client to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Build
        run: cd client && npm run build
        env:
          VITE_API_URL: https://sharemyapps-server-653466296307.us-central1.run.app

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project sharemyapps-498401 --non-interactive
